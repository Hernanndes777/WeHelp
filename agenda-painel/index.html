<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="robots" content="noindex, nofollow" />
<title>Painel de Agendamentos | WeHelp na Fitness Brasil 2026</title>
<link rel="icon" href="../shared/logo-wehelp.png" type="image/png" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@600;700;800;900&family=DM+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.19.0/dist/tabler-icons.min.css" />
<style>
  *, *::before, *::after { box-sizing: border-box; }
  :root{
    --blue: #1B6EF3;
    --blue-hover: #1457c8;
    --blue-tint: #e8f0ff;
    --navy: #0a1128;
    --ink: #1a2036;
    --body: #4a5568;
    --muted: #8593ab;
    --line: #e2e8f0;
    --bg: #f4f6fb;
    --surface: #ffffff;
    --good: #0e9f6e;
    --good-tint: #e6f7f0;
    --bad: #e1473c;
    --bad-tint: #fdeceb;
    --disp: 'Figtree', sans-serif;
  }
  body{
    margin:0; font-family:'DM Sans',sans-serif; background:var(--bg); color:var(--ink);
    line-height:1.5; -webkit-font-smoothing:antialiased;
  }
  .wrap{ max-width:760px; margin:0 auto; padding: 0 20px 60px; }
  .hero{
    padding: 26px 0 30px; text-align:center;
    background: radial-gradient(600px 400px at 50% -20%, rgba(27,110,243,.45), transparent 65%), var(--navy);
    margin-bottom: 24px;
  }
  .brand{ display:inline-flex; align-items:center; gap:8px; margin-bottom:14px; }
  .brand img{ height:22px; width:auto; }
  .brand span{ font-family:var(--disp); font-size:16px; font-weight:800; color:#fff; }
  .hero h1{
    font-family: var(--disp); font-weight:900; color:#fff; margin:0;
    font-size: clamp(19px, 4.5vw, 24px); line-height:1.25; padding: 0 16px;
  }

  .toolbar{ display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom:14px; flex-wrap:wrap; }
  .day-tabs{ display:flex; gap:8px; flex:1; }
  .day-tab{
    flex:1; text-align:center; padding:11px 6px; border-radius:12px; border:1.5px solid var(--line);
    background:#fff; cursor:pointer; font-family:var(--disp); font-weight:700; font-size:13px; color:var(--body);
  }
  .day-tab small{ display:block; font-weight:600; font-size:10px; color:var(--muted); margin-top:2px; text-transform:uppercase; }
  .day-tab.active{ border-color:var(--blue); background:var(--blue-tint); color:var(--blue-hover); }
  .day-tab.active small{ color:var(--blue-hover); }

  .refresh-btn{
    display:flex; align-items:center; gap:6px; padding:11px 14px; border-radius:12px; border:1.5px solid var(--line);
    background:#fff; cursor:pointer; font-family:var(--disp); font-weight:700; font-size:12.5px; color:var(--body);
    white-space:nowrap;
  }
  .refresh-btn i{ color:var(--blue); }
  .refresh-btn.spinning i{ animation: spin 0.7s linear infinite; }
  @keyframes spin{ to{ transform: rotate(360deg); } }

  .summary{
    display:flex; gap:10px; margin-bottom:16px; flex-wrap:wrap;
  }
  .stat{
    flex:1; min-width:110px; background:var(--surface); border:1px solid var(--line); border-radius:12px;
    padding:12px 14px; box-shadow: 0 1px 2px rgba(16,28,66,.04);
  }
  .stat b{ display:block; font-family:var(--disp); font-size:20px; font-weight:800; color:var(--ink); }
  .stat span{ font-size:11.5px; color:var(--muted); font-weight:600; }

  .slot-block{
    background:var(--surface); border:1px solid var(--line); border-radius:14px; margin-bottom:10px;
    box-shadow: 0 1px 2px rgba(16,28,66,.04);
  }
  .slot-time{
    display:flex; align-items:center; gap:8px; padding:12px 16px; border-bottom:1px solid var(--line);
    font-family:var(--disp); font-weight:800; font-size:14px; color:var(--ink);
  }
  .slot-time i{ color:var(--blue); font-size:15px; }
  .slot-time .count{ margin-left:auto; font-size:11px; font-weight:700; color:var(--muted); }

  .lead-row{
    display:flex; align-items:center; gap:12px; padding:12px 16px; border-bottom:1px solid var(--line);
  }
  .lead-row:last-child{ border-bottom:none; }
  .lead-row.empty{ color:var(--muted); font-size:13px; font-style:italic; }
  .lead-info{ flex:1; min-width:0; }
  .lead-name{ font-weight:700; font-size:14px; color:var(--ink); }
  .lead-meta{ font-size:12px; color:var(--body); margin-top:2px; }
  .lead-badges{ display:flex; gap:6px; margin-top:6px; flex-wrap:wrap; }
  .badge{
    display:inline-flex; align-items:center; gap:4px; font-size:10.5px; font-weight:700;
    padding:3px 9px; border-radius:50px;
  }
  .badge.blue{ background:var(--blue-tint); color:var(--blue-hover); }
  .badge.good{ background:var(--good-tint); color:var(--good); }
  .badge.bad{ background:var(--bad-tint); color:var(--bad); }
  .wa-link{
    display:flex; align-items:center; justify-content:center; width:36px; height:36px; border-radius:10px;
    background:var(--good-tint); color:var(--good); flex-shrink:0; font-size:17px;
  }

  .empty-day{ text-align:center; color:var(--muted); font-size:13.5px; padding:40px 20px; }
  .loading{ text-align:center; color:var(--muted); font-size:13.5px; padding:40px 20px; }
</style>
</head>
<body>

  <div class="hero">
    <div class="brand"><img src="../shared/logo-wehelp.png" alt="" /><span>WeHelp</span></div>
    <h1>Painel de Agendamentos — Fitness Brasil 2026</h1>
  </div>

  <div class="wrap">
    <div class="toolbar">
      <div class="day-tabs" id="dayTabs"></div>
      <button class="refresh-btn" id="refreshBtn"><i class="ti ti-refresh"></i> Atualizar</button>
    </div>

    <div class="summary" id="summary"></div>

    <div id="content"><div class="loading">Carregando agendamentos...</div></div>
  </div>

<script>
  const DAYS = [
    { date: '2026-08-27', label: 'Qui', num: '27/08' },
    { date: '2026-08-28', label: 'Sex', num: '28/08' },
    { date: '2026-08-29', label: 'Sáb', num: '29/08' },
  ];
  const START_HOUR = 10, END_HOUR = 19;
  const MAX_PER_SLOT = 2;
  const BLOCKED = {
    '2026-08-28': ['17:00', '17:30', '18:00', '18:30'],
  };

  function buildSlots() {
    const slots = [];
    for (let h = START_HOUR; h < END_HOUR; h++) {
      slots.push(`${String(h).padStart(2,'0')}:00`);
      slots.push(`${String(h).padStart(2,'0')}:30`);
    }
    return slots;
  }
  const ALL_SLOTS = buildSlots();

  let selectedDate = DAYS[0].date;
  let allRows = [];

  const dayTabsEl = document.getElementById('dayTabs');
  const contentEl = document.getElementById('content');
  const summaryEl = document.getElementById('summary');
  const refreshBtn = document.getElementById('refreshBtn');

  function renderDayTabs() {
    dayTabsEl.innerHTML = DAYS.map(d => {
      const count = allRows.filter(r => r.date === d.date).length;
      return `
        <div class="day-tab ${d.date === selectedDate ? 'active' : ''}" data-date="${d.date}">
          ${d.label}<small>${d.num} · ${count}</small>
        </div>`;
    }).join('');
    dayTabsEl.querySelectorAll('.day-tab').forEach(el => {
      el.addEventListener('click', () => {
        selectedDate = el.dataset.date;
        render();
      });
    });
  }

  function escapeHtml(s) {
    return String(s || '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }

  function waLink(phone) {
    const digits = String(phone || '').replace(/\D/g, '');
    return digits ? `https://wa.me/${digits}` : '#';
  }

  function render() {
    renderDayTabs();

    const dayRows = allRows.filter(r => r.date === selectedDate);

    summaryEl.innerHTML = `
      <div class="stat"><b>${dayRows.length}</b><span>Agendados no dia</span></div>
      <div class="stat"><b>${dayRows.filter(r => r.leadStatus === 'encontrado').length}</b><span>Encontrados no CRM</span></div>
      <div class="stat"><b>${dayRows.filter(r => r.leadStatus !== 'encontrado').length}</b><span>Não encontrados</span></div>
    `;

    const blocked = BLOCKED[selectedDate] || [];
    const visibleSlots = ALL_SLOTS.filter(t => !blocked.includes(t));

    if (dayRows.length === 0) {
      contentEl.innerHTML = '<div class="empty-day">Nenhum agendamento neste dia ainda.</div>';
      return;
    }

    contentEl.innerHTML = visibleSlots.map(time => {
      const leads = dayRows.filter(r => r.time === time);
      if (leads.length === 0) return '';

      const rowsHtml = leads.map(l => `
        <div class="lead-row">
          <a class="wa-link" href="${waLink(l.whatsapp)}" target="_blank" rel="noopener"><i class="ti ti-brand-whatsapp"></i></a>
          <div class="lead-info">
            <div class="lead-name">${escapeHtml(l.nome)}</div>
            <div class="lead-meta">${escapeHtml(l.academia)} · ${escapeHtml(l.whatsapp)}</div>
            <div class="lead-badges">
              <span class="badge blue">${escapeHtml(l.interesse)}</span>
              ${l.leadStatus === 'encontrado'
                ? '<span class="badge good"><i class="ti ti-circle-check"></i> No CRM</span>'
                : '<span class="badge bad"><i class="ti ti-alert-circle"></i> Não encontrado no CRM</span>'}
            </div>
          </div>
        </div>
      `).join('') + (leads.length < MAX_PER_SLOT ? `<div class="lead-row empty">${MAX_PER_SLOT - leads.length} vaga(s) livre(s)</div>` : '');

      return `
        <div class="slot-block">
          <div class="slot-time"><i class="ti ti-clock"></i> ${time} <span class="count">${leads.length}/${MAX_PER_SLOT}</span></div>
          ${rowsHtml}
        </div>`;
    }).join('');
  }

  async function loadData(showSpinner) {
    if (showSpinner) refreshBtn.classList.add('spinning');
    try {
      const res = await fetch('/api/agenda-painel');
      const data = await res.json();
      allRows = data.rows || [];
    } catch (e) {
      // mantém os dados anteriores em caso de falha temporária
    }
    render();
    if (showSpinner) refreshBtn.classList.remove('spinning');
  }

  refreshBtn.addEventListener('click', () => loadData(true));

  loadData(true);
  setInterval(() => loadData(false), 60000); // atualiza sozinho a cada 1 min
</script>
</body>
</html>
