<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <meta name="theme-color" content="#0E7C86" />
  <title>Central de Performance · WeHelp</title>
  <!-- Hub de relatórios semanais. Sidebar mês→semana; cada semana é um JSON em /performance/weeks/.
       Pra lançar uma semana nova: crie weeks/<domingo>.json e adicione no manifest.json. -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" />
  <style>
    :root{
      color-scheme: light;
      --bg:#F5F6F8; --surface:#fff; --surface-2:#F1F3F6; --ink:#1A1F26; --ink-2:#48515C;
      --muted:#7C8595; --line:#E7EAEF; --line-2:#D7DCE4;
      --accent:#0E7C86; --accent-deep:#0B5C64; --accent-soft:#E1F1F2;
      --meta:#1877F2; --meta-soft:#E4EEFD; --google:#E4890F; --google-soft:#FBEEDA;
      --lead:#128A5B; --lead-soft:#DEF3E9; --warn:#B9720A;
      --shadow:0 1px 2px rgba(20,25,35,.04), 0 6px 20px -14px rgba(20,25,35,.18); --radius:12px;
    }
    *{box-sizing:border-box;}
    html{background:var(--bg);}
    body{margin:0;background:var(--bg);color:var(--ink);font-family:"IBM Plex Sans",system-ui,-apple-system,sans-serif;font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased;}
    .app{display:grid;grid-template-columns:236px 1fr;min-height:100vh;}
    @media(max-width:820px){.app{grid-template-columns:1fr;}}
    /* sidebar */
    .side{background:var(--surface);border-right:1px solid var(--line);padding:16px 12px 24px;position:sticky;top:0;align-self:start;height:100vh;overflow:auto;}
    @media(max-width:820px){.side{position:static;height:auto;border-right:0;border-bottom:1px solid var(--line);}}
    .brand{display:flex;align-items:center;gap:10px;padding:6px 8px 16px;border-bottom:1px solid var(--line);margin-bottom:8px;}
    .brand .mark{width:30px;height:30px;border-radius:8px;flex:none;background:linear-gradient(135deg,var(--accent),#12A0AD);color:#fff;font-weight:700;font-size:15px;display:grid;place-items:center;}
    .brand .nm{font-weight:700;font-size:14px;line-height:1.15;}
    .brand .nm small{display:block;color:var(--muted);font-weight:500;font-size:11px;}
    .meslbl{font-size:11px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);margin:16px 8px 6px;}
    .wk{display:flex;align-items:center;gap:9px;width:100%;text-align:left;border:0;background:transparent;padding:8px 10px;border-radius:8px;cursor:pointer;font-family:inherit;font-size:13px;color:var(--ink-2);}
    .wk:hover{background:var(--surface-2);}
    .wk[aria-current="true"]{background:var(--accent-soft);color:var(--accent-deep);font-weight:600;}
    .wk .dot{width:8px;height:8px;border-radius:50%;flex:none;background:var(--muted);}
    .wk .dot.fechada{background:var(--lead);} .wk .dot.atual{background:var(--accent);} .wk .dot.pendente{background:var(--line-2);}
    .wk .tag{margin-left:auto;font-size:10px;color:var(--muted);}
    /* main */
    .main{min-width:0;}
    .topbar{background:var(--surface);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5;}
    .topbar-inner{padding:14px 24px;display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;}
    .topbar h1{font-size:16px;font-weight:700;margin:0;letter-spacing:-.01em;}
    .topbar .st{font-size:12px;color:var(--muted);}
    .badge{font-size:11px;font-weight:600;padding:2px 9px;border-radius:999px;}
    .badge.fechada{background:var(--lead-soft);color:var(--lead);} .badge.atual{background:var(--accent-soft);color:var(--accent-deep);} .badge.pendente{background:var(--surface-2);color:var(--muted);}
    .wrap{max-width:1120px;margin:18px auto 0;padding:0 24px 56px;}
    .sectitle{font-size:15px;font-weight:700;color:var(--ink);margin:24px 0 12px;letter-spacing:-.01em;}
    .sectitle:first-child{margin-top:0;}
    .sectitle small{font-weight:500;color:var(--muted);font-size:12px;margin-left:6px;}
    .kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;}
    @media(max-width:720px){.kpis{grid-template-columns:1fr;}}
    .card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);}
    .kpi{padding:16px 17px;}
    .kpi .cap{font-size:12px;color:var(--muted);font-weight:500;margin-bottom:8px;}
    .kpi .v{font-family:"IBM Plex Mono",monospace;font-size:27px;font-weight:600;line-height:1.05;letter-spacing:-.01em;}
    .kpi .foot{font-size:11.5px;color:var(--muted);margin-top:6px;}
    .kpi .foot b{color:var(--ink-2);font-weight:600;}
    .kpi .foot .org{background:var(--lead-soft);color:var(--lead);font-weight:700;padding:1px 8px;border-radius:999px;white-space:nowrap;}
    .kpi.lead{border-top:3px solid var(--lead);} .kpi.spend{border-top:3px solid var(--accent);}
    .grid{display:grid;grid-template-columns:1.35fr 1fr;gap:14px;}
    @media(max-width:880px){.grid{grid-template-columns:1fr;}}
    .grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px;align-items:start;}
    @media(max-width:880px){.grid2{grid-template-columns:1fr;}}
    .panel{padding:18px 20px 20px;}
    .panel h2{font-size:15px;font-weight:700;margin:0 0 2px;letter-spacing:-.01em;}
    .panel .desc{font-size:12.5px;color:var(--muted);margin:0 0 16px;}
    .tablewrap{overflow-x:auto;}
    table{width:100%;border-collapse:collapse;font-size:13px;min-width:440px;}
    thead th{text-align:right;font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:600;padding:0 12px 10px;white-space:nowrap;border-bottom:1px solid var(--line-2);}
    thead th:first-child{text-align:left;}
    tbody td{padding:12px 12px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap;font-family:"IBM Plex Mono",monospace;font-variant-numeric:tabular-nums;}
    tbody td:first-child{text-align:left;font-family:"IBM Plex Sans",sans-serif;}
    tbody tr.total td{font-weight:700;color:var(--ink);border-bottom:none;background:var(--surface-2);}
    .src{font-weight:600;color:var(--ink);display:flex;align-items:center;gap:7px;}
    .dot2{width:8px;height:8px;border-radius:50%;flex:none;} .dot2.g{background:var(--google);} .dot2.m{background:var(--meta);}
    .sub{font-family:"IBM Plex Sans",sans-serif;font-size:11px;color:var(--muted);font-weight:400;}
    .plat{font-family:"IBM Plex Sans",sans-serif;font-size:11px;font-weight:600;padding:2px 8px;border-radius:999px;}
    .plat.g{background:var(--google-soft);color:#8a5206;} .plat.m{background:var(--meta-soft);color:#12488f;}
    .report .eyebrow{font-size:11px;font-weight:600;letter-spacing:.11em;text-transform:uppercase;color:var(--accent);margin-bottom:4px;}
    .report h1{font-size:19px;font-weight:700;margin:0 0 14px;}
    .bignum{display:flex;align-items:baseline;gap:10px;margin-bottom:4px;}
    .bignum .v{font-family:"IBM Plex Mono",monospace;font-size:44px;font-weight:600;line-height:1;letter-spacing:-.02em;}
    .bignum .lbl{font-size:13px;color:var(--ink-2);font-weight:500;}
    .fitem{margin-top:14px;}
    .fhead{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:5px;}
    .fhead .nm{font-size:13px;font-weight:500;} .fhead .nm small{color:var(--muted);font-weight:400;}
    .fhead .fig{font-family:"IBM Plex Mono",monospace;font-size:13px;color:var(--ink);font-weight:600;}
    .ftrack{height:7px;background:var(--surface-2);border-radius:999px;overflow:hidden;}
    .ftrack > i{display:block;height:100%;border-radius:999px;}
    .divider{margin:18px 0 0;padding-top:16px;border-top:1px solid var(--line);}
    .kv{display:flex;justify-content:space-between;font-size:13px;margin-bottom:6px;}
    .kv .k{color:var(--ink-2);} .kv .val{font-family:"IBM Plex Mono",monospace;font-weight:600;}
    .kv.big .val{font-size:16px;}
    .wbfunnel{display:flex;flex-direction:column;gap:9px;margin-top:4px;}
    .wbstep{display:grid;grid-template-columns:118px 1fr auto;gap:10px;align-items:center;font-size:12.5px;}
    .wbstep .lbl{color:var(--ink-2);}
    .wbstep .bar{height:20px;background:var(--surface-2);border-radius:5px;overflow:hidden;}
    .wbstep .bar > i{display:block;height:100%;background:linear-gradient(90deg,var(--meta),#5b9bff);border-radius:5px;}
    .wbstep .n{font-family:"IBM Plex Mono",monospace;font-weight:600;white-space:nowrap;} .wbstep .n small{color:var(--muted);font-weight:400;}
    .foot-note{margin-top:20px;font-size:11.5px;color:var(--muted);line-height:1.5;} .foot-note b{color:var(--ink-2);}
    .notewarn{font-size:11px;color:#8a5206;background:var(--google-soft);border:1px solid #F0DDB6;border-radius:8px;padding:7px 11px;margin-top:12px;}
    .pie-wrap{display:flex;align-items:center;gap:30px;flex-wrap:wrap;}
    .donut{width:190px;height:190px;flex:none;}
    .pie-num{font-family:"IBM Plex Mono",monospace;font-size:34px;font-weight:600;fill:var(--ink);} .pie-lbl{font-size:12px;fill:var(--muted);}
    .legend{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:12px;min-width:210px;flex:1;}
    .legend li{display:flex;align-items:center;gap:10px;font-size:13.5px;}
    .legend .sw{width:12px;height:12px;border-radius:3px;flex:none;}
    .legend b{font-family:"IBM Plex Mono",monospace;margin-left:auto;} .legend small{color:var(--muted);font-family:"IBM Plex Mono",monospace;width:42px;text-align:right;}
    .bars{display:flex;flex-direction:column;gap:10px;}
    .brow{display:grid;grid-template-columns:120px 1fr auto;gap:12px;align-items:center;font-size:13px;}
    .brow .lbl{color:var(--ink-2);}
    .brow .track{height:22px;background:var(--surface-2);border-radius:5px;overflow:hidden;}
    .brow .track > i{display:block;height:100%;background:var(--accent);border-radius:5px;}
    .brow .n{font-family:"IBM Plex Mono",monospace;font-weight:600;white-space:nowrap;} .brow .n small{color:var(--muted);font-weight:400;}
    .orgtable th,.orgtable td{text-align:left;font-family:"IBM Plex Sans",sans-serif;white-space:normal;vertical-align:top;}
    .orgtable td{font-size:12.5px;padding:10px 12px;}
    .ltabs{display:flex;gap:4px;background:var(--surface-2);padding:3px;border-radius:9px;flex-wrap:wrap;width:fit-content;margin-bottom:16px;}
    .ltab{appearance:none;border:0;background:transparent;cursor:pointer;font-family:inherit;font-size:12.5px;font-weight:600;color:var(--ink-2);padding:6px 13px;border-radius:7px;}
    .ltab[aria-selected="true"]{background:var(--surface);color:var(--accent);box-shadow:0 1px 2px rgba(0,0,0,.06);}
    .state{padding:60px 24px;text-align:center;color:var(--muted);}
    [hidden]{display:none!important;}
  </style>
</head>
<body>
  <div class="app">
    <aside class="side">
      <div class="brand"><div class="mark">W</div><div class="nm">WeHelp<small>Central de Performance</small></div></div>
      <nav id="nav"></nav>
    </aside>
    <main class="main">
      <div class="topbar"><div class="topbar-inner">
        <h1 id="ttl">Central de Performance</h1>
        <div style="display:flex;align-items:center;gap:12px"><span class="st" id="st"></span><span class="badge" id="bdg" hidden></span></div>
      </div></div>
      <div class="wrap" id="view"><div class="state">Carregando…</div></div>
    </main>
  </div>

  <script>
  (function () {
    "use strict";
    var view = document.getElementById('view'), nav = document.getElementById('nav');
    var ttl = document.getElementById('ttl'), st = document.getElementById('st'), bdg = document.getElementById('bdg');
    function esc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

    /* ---------- render helpers ---------- */
    function sec(t, small){ return '<div class="sectitle">'+esc(t)+(small?' <small>'+esc(small)+'</small>':'')+'</div>'; }

    function kpis(w){
      var g=w.geral;
      return '<section class="kpis">'
        + '<div class="card kpi lead"><div class="cap">Leads que entraram</div><div class="v">'+g.leads+'</div><div class="foot">'+esc(g.leads_foot||'').replace(/(\+\s*\d+\s*org[âa]nico)/i,'<span class="org">$1</span>')+'</div></div>'
        + '<div class="card kpi spend"><div class="cap">Investimento total</div><div class="v">'+esc(g.investimento_total)+'</div><div class="foot">'+esc(g.investimento_foot||'')+'</div></div>'
        + '<div class="card kpi lead"><div class="cap">Conseguimos contatar</div><div class="v">'+g.contatados+' <span style="font-size:16px;color:var(--lead)">· '+g.contatados_pct+'%</span></div><div class="foot">'+esc(g.contatados_foot||'')+'</div></div>'
        + '</section>';
    }

    function fonteGrid(w){
      var rows=w.fontes.map(function(f){
        return '<tr><td><span class="src"><span class="dot2 '+(f.cor||'m')+'"></span>'+esc(f.nome)+' <span class="plat '+(f.cor||'m')+'">'+esc(f.plataforma)+'</span></span>'
          + (f.sub?'<span class="sub">'+esc(f.sub)+'</span>':'')+'</td>'
          + '<td>'+f.leads+'</td><td>'+f.contatados+' <span class="sub">'+f.contatados_pct+'%</span></td>'
          + '<td>'+esc(f.investimento)+'</td><td>'+esc(f.custo_lead).replace(' /lead · ',' <span class="sub">/lead</span><br>').replace(' /agend.',' <span class="sub">/agend.</span>')+'</td></tr>';
      }).join('');
      var t=w.fontes_total;
      rows+='<tr class="total"><td>Total</td><td>'+t.leads+'</td><td>'+t.contatados+' <span class="sub">'+t.contatados_pct+'%</span></td><td>'+esc(t.investimento)+'</td><td>—</td></tr>';
      var funnel=(w.wb_funnel||[]).map(function(s){return '<div class="wbstep"><span class="lbl">'+esc(s.lbl)+'</span><span class="bar"><i style="width:'+s.pct+'%"></i></span><span class="n">'+s.n+' <small>· '+esc(s.extra)+'</small></span></div>';}).join('');
      var g=w.geral;
      return '<div class="grid"><section class="card panel"><h2>Investimento por fonte</h2><p class="desc">Leads captados, quanto custou e o custo por lead de cada origem na semana.</p>'
        + '<div class="tablewrap"><table><thead><tr><th>Fonte</th><th>Leads</th><th>Contatados</th><th>Investimento</th><th>Custo/lead</th></tr></thead><tbody>'+rows+'</tbody></table></div>'
        + (funnel?'<p class="sectitle" style="margin:22px 0 12px;font-family:\'IBM Plex Mono\',monospace;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)">Funil do Webinário</p><div class="wbfunnel">'+funnel+'</div>':'')
        + '</section>'
        + '<aside class="card panel report"><div class="eyebrow">Relatório da semana</div><h1>Leads captados</h1>'
        + '<div class="bignum"><span class="v">'+g.leads+'</span><span class="lbl">leads<br>entraram</span></div>'
        + w.fontes.map(function(f){var mx=Math.max.apply(null,w.fontes.map(function(x){return x.leads;}))||1; var col=f.cor==='g'?'var(--google)':'var(--meta)'; return '<div class="fitem"><div class="fhead"><span class="nm">'+esc(f.nome)+'</span><span class="fig">'+f.leads+'</span></div><div class="ftrack"><i style="width:'+(f.leads/mx*100).toFixed(1)+'%;background:'+col+'"></i></div></div>';}).join('')
        + '<div class="divider"><div class="kv big"><span class="k">Conseguimos contatar</span><span class="val" style="color:var(--lead)">'+g.contatados+' · '+g.contatados_pct+'%</span></div>'
        + '<div class="kv big"><span class="k">Investimento total</span><span class="val">'+esc(g.investimento_total)+'</span></div></div></aside></div>';
    }

    function organico(w){
      var o=w.organico; if(!o) return '';
      var rows=o.lista.map(function(l){return '<tr><td>'+esc(l.nome)+'</td><td>'+esc(l.empresa)+'</td><td>'+esc(l.contato)+'</td></tr>';}).join('');
      return sec('Orgânico · Site Oficial','sem investimento')
        + '<section class="card panel"><p class="desc" style="margin-bottom:16px">Leads que chegaram pelo site oficial de forma orgânica (tag "Site Oficial" no DataCrazy), sem custo de mídia.</p>'
        + '<div class="tablewrap"><table class="orgtable"><thead><tr><th>Lead</th><th>Empresa</th><th>Contato</th></tr></thead><tbody>'+rows
        + '<tr class="total"><td>Total · '+o.lista.length+' leads</td><td>Tráfego orgânico</td><td>'+esc(o.total_invest)+'</td></tr></tbody></table></div></section>';
    }

    function donut(segs){
      var total=segs.reduce(function(a,s){return a+s.valor;},0)||1, C=2*Math.PI*80, off=0, circ='';
      segs.forEach(function(s){var len=s.valor/total*C; circ+='<circle cx="100" cy="100" r="80" stroke="'+s.cor+'" stroke-dasharray="'+len.toFixed(2)+' '+(C-len).toFixed(2)+'" stroke-dashoffset="'+(-off).toFixed(2)+'"></circle>'; off+=len;});
      var leg=segs.map(function(s){return '<li><span class="sw" style="background:'+s.cor+'"></span>'+esc(s.nome)+'<b>'+s.valor+'</b><small>'+Math.round(s.valor/total*100)+'%</small></li>';}).join('');
      return '<div class="pie-wrap"><svg viewBox="0 0 200 200" class="donut"><g transform="rotate(-90 100 100)" fill="none" stroke-width="34"><circle cx="100" cy="100" r="80" stroke="var(--surface-2)"></circle>'+circ+'</g><text x="100" y="96" text-anchor="middle" class="pie-num">'+total+'</text><text x="100" y="116" text-anchor="middle" class="pie-lbl">leads</text></svg><ul class="legend">'+leg+'</ul></div>';
    }
    function barras(porte){
      var total=porte.reduce(function(a,p){return a+p.valor;},0)||1, max=Math.max.apply(null,porte.map(function(p){return p.valor;}))||1;
      return '<div class="bars">'+porte.map(function(p){return '<div class="brow"><span class="lbl">'+esc(p.faixa)+'</span><span class="track"><i style="width:'+(p.valor/max*100).toFixed(1)+'%"></i></span><span class="n">'+p.valor+' <small>· '+Math.round(p.valor/total*100)+'%</small></span></div>';}).join('')+'</div>';
    }
    function graficos(w){
      var hasSeg=w.segmento&&w.segmento.length, hasPorte=w.porte&&w.porte.length;
      if(!hasSeg&&!hasPorte) return '';
      var cards='';
      if(hasSeg) cards+='<section class="card panel"><h2>Por segmento</h2><p class="desc" style="margin-bottom:18px">Segmento de negócio das empresas que viraram lead.</p>'+donut(w.segmento)+'</section>';
      if(hasPorte) cards+='<section class="card panel"><h2>Por porte · clientes ativos</h2><p class="desc" style="margin-bottom:18px">Faixa de clientes/alunos ativos informada no formulário.</p>'+barras(w.porte)+'</section>';
      var title=(hasSeg&&hasPorte)?'Leads por segmento e por porte':(hasSeg?'Leads por segmento':'Leads por porte');
      return sec(title)+'<div class="'+((hasSeg&&hasPorte)?'grid2':'')+'">'+cards+'</div>';
    }

    function tabela(obj){
      var th=obj.cols.map(function(c){return '<th>'+esc(c)+'</th>';}).join('');
      var body=obj.rows.map(function(r){return '<tr>'+r.map(function(c){return '<td>'+esc(c)+'</td>';}).join('')+'</tr>';}).join('');
      return '<div class="tablewrap"><table class="orgtable"><thead><tr>'+th+'</tr></thead><tbody>'+body+'</tbody></table></div>';
    }
    function leads(w){
      var L=w.leads; if(!L) return '';
      var btns=L.tabs.map(function(t,i){return '<button class="ltab" data-t="'+t.key+'" aria-selected="'+(i===0?'true':'false')+'">'+esc(t.label)+' · '+t.n+'</button>';}).join('');
      var panels=L.tabs.map(function(t,i){return '<div class="lpanel" data-p="'+t.key+'"'+(i===0?'':' hidden')+'>'+tabela(L[t.key])+'</div>';}).join('');
      return sec('Todos os leads da semana','clique na fonte')
        + '<section class="card panel"><div class="ltabs">'+btns+'</div>'+panels
        + '<p class="foot-note">Campos técnicos (IP, IDs de formulário, tokens) foram omitidos.</p></section>';
    }

    function render(w){
      view.innerHTML = kpis(w) + fonteGrid(w) + organico(w) + graficos(w) + leads(w);
      var tabs=view.querySelectorAll('.ltab');
      tabs.forEach(function(b){ b.addEventListener('click', function(){
        tabs.forEach(function(x){ x.setAttribute('aria-selected', x===b?'true':'false'); });
        view.querySelectorAll('.lpanel').forEach(function(p){ p.hidden = p.getAttribute('data-p')!==b.dataset.t; });
      });});
    }

    /* ---------- data / navegação ---------- */
    var STATUS = { fechada:'Fechada', atual:'Semana atual', pendente:'Aguardando' };
    var current = null, semanas = {};

    function setActive(id){
      nav.querySelectorAll('.wk').forEach(function(b){ b.setAttribute('aria-current', b.dataset.id===id?'true':'false'); });
    }
    function loadWeek(item){
      current = item.id; setActive(item.id);
      ttl.textContent = 'Semana ' + item.label;
      bdg.hidden=false; bdg.className='badge '+item.status; bdg.textContent=STATUS[item.status]||item.status;
      st.textContent = item.periodo || '';
      try { history.replaceState(null,'', '?semana='+item.id); } catch(e){}
      if(item.status==='pendente'){ view.innerHTML='<div class="state">Sem dados dessa semana ainda.<br>Assim que o fechamento for lançado, aparece aqui.</div>'; return; }
      view.innerHTML='<div class="state">Carregando…</div>';
      fetch('/performance/weeks/'+item.id+'.json',{cache:'no-store'}).then(function(r){ if(!r.ok) throw 0; return r.json(); })
        .then(function(w){ st.textContent = w.periodo || item.periodo || ''; render(w); })
        .catch(function(){ view.innerHTML='<div class="state">Sem dados dessa semana ainda.</div>'; });
    }

    fetch('/performance/weeks/manifest.json',{cache:'no-store'}).then(function(r){return r.json();}).then(function(m){
      var html='';
      m.meses.forEach(function(mes){
        html+='<div class="meslbl">'+esc(mes.nome)+'</div>';
        mes.semanas.forEach(function(s){
          semanas[s.id]=s;
          html+='<button class="wk" data-id="'+s.id+'"><span class="dot '+s.status+'"></span>'+esc(s.label)+'<span class="tag">'+(s.status==='atual'?'atual':(s.status==='pendente'?'—':''))+'</span></button>';
        });
      });
      nav.innerHTML=html;
      nav.querySelectorAll('.wk').forEach(function(b){ b.addEventListener('click', function(){ loadWeek(semanas[b.dataset.id]); }); });
      var q=new URLSearchParams(location.search).get('semana');
      var startId = (q && semanas[q]) ? q : m.default;
      loadWeek(semanas[startId] || m.meses[0].semanas[0]);
    }).catch(function(){ view.innerHTML='<div class="state">Não consegui carregar o índice de semanas.</div>'; });
  })();
  </script>
</body>
</html>
