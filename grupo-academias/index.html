  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'DM Sans', sans-serif;
      background: #0a1128;
      color: #fff;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      -webkit-font-smoothing: antialiased;
    }
    a { text-decoration: none; color: inherit; }

    .card {
      text-align: center;
      max-width: 420px;
    }
    .brand {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      margin-bottom: 32px;
    }
    .brand__icon {
      width: 34px; height: 34px;
      background: #1B6EF3;
      border-radius: 9px;
      display: flex; align-items: center; justify-content: center;
    }
    .brand__icon i { font-size: 18px; color: #fff; }
    .brand span {
      font-family: 'Figtree', sans-serif;
      font-size: 19px; font-weight: 800;
    }

    .spinner {
      width: 44px; height: 44px;
      border: 3px solid rgba(255,255,255,.15);
      border-top-color: #25D366;
      border-radius: 50%;
      margin: 0 auto 24px;
      animation: spin .8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    @media (prefers-reduced-motion: reduce) {
      .spinner { animation: none; border-top-color: rgba(255,255,255,.15); }
    }

    h1 {
      font-family: 'Figtree', sans-serif;
      font-size: 22px;
      font-weight: 800;
      margin-bottom: 10px;
      text-wrap: balance;
    }
    p {
      font-size: 14px;
      color: #b0c4e8;
      line-height: 1.6;
      margin-bottom: 28px;
    }

    /* Verde do WhatsApp e nao o azul da marca: o botao precisa dizer pra onde
       leva antes de ser lido. Quem vem do formulario nao conhece a WeHelp. */
    .btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: #25D366;
      color: #06331a;
      font-size: 14px;
      font-weight: 700;
      letter-spacing: .5px;
      text-transform: uppercase;
      padding: 15px 28px;
      border-radius: 50px;
      transition: background .2s, transform .2s;
    }
    .btn:hover { background: #1fb855; transform: translateY(-1px); }
    .btn:focus-visible { outline: 3px solid #fff; outline-offset: 3px; }
    .btn i { font-size: 17px; }

  <div class="card">
    <div class="brand">
      <div class="brand__icon"><i class="ti ti-users" aria-hidden="true"></i></div>
      <span>WeHelp</span>
    </div>

    <div class="spinner" aria-hidden="true"></div>

    <h1>Abrindo o grupo no WhatsApp...</h1>
    <p>
      É no grupo que a gente mostra como prever o cancelamento do aluno
      antes que ele aconteça. Se o WhatsApp não abrir sozinho, toque no
      botão abaixo.
    </p>

    <a href="https://chat.whatsapp.com/KZ9ux6l9LpX4QJXDMQObt3" class="btn" id="manualLink">
      <i class="ti ti-brand-whatsapp" aria-hidden="true"></i>
      Entrar no grupo
    </a>
  </div>

  <!-- Meta Pixel -->
  <script>
    !function(f,b,e,v,n,t,s)

    'https://connect.facebook.net/en_US/fbevents.js');
    fbq('init', '1106401696374974');

  <noscript>
    <img height="1" width="1" style="display:none"
    src="https://www.facebook.com/tr?id=1106401696374974&ev=PageView&noscript=1"/>
  </noscript>

  <script>
    // O slug /grupo-academias nunca muda; so este valor muda quando o grupo
    // lota ou o convite e revogado. E por isso que o formulario do Meta aponta
    // pra ca e nao pro chat.whatsapp.com direto: link de grupo expira, e
    // editar o formulario no ar mexe no anuncio.
    // Atualizado 2026-09-10.
    const GRUPO_URL = 'https://chat.whatsapp.com/KZ9ux6l9LpX4QJXDMQObt3';

    document.getElementById('manualLink').href = GRUPO_URL;

    // Evento proprio pra separar de outros cliques de grupo no Events Manager.
    // Vai pro pixel e nao pro GA4 de proposito: o acesso ao GTM nao esta com a
    // gente, e o Events Manager e onde da pra transformar isso em conversao.
    const params = new URLSearchParams(location.search);
    if (typeof fbq === 'function') {
      fbq('trackCustom', 'GrupoJoinClick', {
        utm_source: params.get('utm_source') || '',
        utm_medium: params.get('utm_medium') || '',
        utm_campaign: params.get('utm_campaign') || '',
      });
    }

    window.dataLayer = window.dataLayer || [];
    window.dataLayer.push({ event: 'grupo_join_click' });

    // 700ms: tempo de o pixel disparar antes de a pagina sumir. O href do botao
    // ja nasce preenchido no HTML, entao mesmo que este script nao rode — ou que
    // o navegador embutido do Instagram bloqueie o redirect — o link funciona.
    setTimeout(() => {
      window.location.replace(GRUPO_URL);
    }, 700);
  </script>
