<html lang="pt-BR">
<head>

  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex" />
  <link rel="icon" href="../shared/logo-wehelp.png" type="image/png" />
  <title>Agenda encerrada — WeHelp</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@600;700;800;900&family=DM+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.19.0/dist/tabler-icons.min.css" />

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'DM Sans', sans-serif;
      background: var(--bg);
      color: var(--text);
      -webkit-font-smoothing: antialiased;
      min-height: 100vh;
    }
    button { font-family: inherit; }
    a { text-decoration: none; color: inherit; }

    :root {
      --blue:       #1B6EF3;
      --blue-hover: #1457c8;
      --blue-light: #e8f0ff;
      --bg:         #f4f6fb;
      --card:       #ffffff;
      --border:     #e2e8f0;
      --text:       #0a1128;
      --body:       #4a5568;
      --muted:      #94a3b8;
      --zap:        #25D366;
      --zap-hover:  #1da851;
    }

    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background:
        radial-gradient(1100px 600px at 15% -10%, rgba(27,110,243,.14), transparent 60%),
        radial-gradient(900px 500px at 100% 110%, rgba(27,110,243,.10), transparent 60%);
      pointer-events: none;
      z-index: 0;
    }

    .page {
      position: relative;
      z-index: 1;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 40px 16px;
    }

    .brand {
      display: flex; align-items: center; justify-content: center; gap: 10px;
      margin-bottom: 32px;
    }
    .brand__logo { height: 32px; width: auto; display: block; }
    .brand span {
      font-family: 'Figtree', sans-serif;
      font-size: 21px; font-weight: 800; color: var(--text);
    }

    .cartao {
      width: 100%;
      max-width: 520px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 40px 34px 32px;
      box-shadow: 0 20px 60px rgba(10,17,40,.08);
      text-align: center;
    }

    .selo {
      width: 64px; height: 64px;
      border-radius: 50%;
      background: var(--blue-light);
      display: flex; align-items: center; justify-content: center;
      margin: 0 auto 22px;
    }
    .selo i { font-size: 32px; color: var(--blue); }

    h1 {
      font-family: 'Figtree', sans-serif;
      font-size: 26px; font-weight: 800; line-height: 1.25;
      margin-bottom: 12px; letter-spacing: -0.01em;
    }
    .sub { font-size: 15px; color: var(--body); line-height: 1.65; margin-bottom: 26px; }
    .sub strong { color: var(--text); font-weight: 700; }

    .btn-zap {
      display: flex; align-items: center; justify-content: center; gap: 10px;
      width: 100%;
      background: var(--zap); color: #fff;
      border-radius: 50px;
      padding: 17px;
      font-size: 15px; font-weight: 700; letter-spacing: .4px;
      box-shadow: 0 8px 24px rgba(37,211,102,.32);
      transition: background .2s, transform .2s;
    }
    .btn-zap:hover { background: var(--zap-hover); transform: translateY(-2px); }
    .btn-zap i { font-size: 21px; }

    .abaixo {
      font-size: 13px; color: var(--muted); margin-top: 16px; line-height: 1.6;
    }

    /* Contagem — só aparece no estado "ainda vai abrir" */
    .relogio {
      display: none;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 18px;
      margin-bottom: 24px;
    }
    .relogio.show { display: block; }
    .relogio__num {
      font-family: 'Figtree', sans-serif;
      font-size: 34px; font-weight: 900; color: var(--blue);
      letter-spacing: -0.02em; line-height: 1;
    }
    .relogio__leg {
      font-size: 12px; color: var(--body); margin-top: 6px;
      text-transform: uppercase; letter-spacing: .8px; font-weight: 700;
    }

    @media (max-width: 480px) {
      .cartao { padding: 32px 22px 26px; border-radius: 16px; }
      h1 { font-size: 22px; }
    }
  </style>
</head>
<body>
  <!-- Google Tag Manager (noscript) -->
  <noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-M2RST4PH"
  height="0" width="0" style="display:none;visibility:hidden"></iframe></noscript>
  <!-- End Google Tag Manager (noscript) -->

  <div class="page">
    <div class="brand">
      <img src="../shared/logo-wehelp.png" alt="WeHelp" class="brand__logo" />
      <span>WeHelp</span>
    </div>

    <div class="cartao">
      <div class="selo"><i class="ti ti-calendar-x" id="icone" aria-hidden="true"></i></div>

      <h1 id="titulo">A agenda desta turma fechou</h1>
      <p class="sub" id="texto"></p>

      <div class="relogio" id="relogio">
        <div class="relogio__num" id="contagem">--:--</div>
        <div class="relogio__leg">para abrir</div>
      </div>

      <a class="btn-zap" id="btnZap" href="#" target="_blank" rel="noopener">
        <i class="ti ti-brand-whatsapp" aria-hidden="true"></i>
        <span id="labelZap">Falar com o comercial</span>
      </a>

      <p class="abaixo" id="abaixo"></p>
    </div>
  </div>

  <script>
    var COMERCIAL = '5521976787182';

    // Mensagem em primeira pessoa de quem manda — é o aluno escrevendo pro
    // comercial, não a WeHelp falando. Já entrega o contexto que o vendedor
    // precisa (veio da aula, quer reunião) pra ele não gastar duas trocas
    // descobrindo quem é.
    var MSGS = {
      depois: 'Oi! Participei agora da aula do Rogério e fui tentar preencher a aplicação, mas a agenda já tinha fechado. Fiquei bem interessado em entender como isso funcionaria na minha academia. Consigo um horário com vocês?',
      antes:  'Oi! Estou na aula do Rogério e quero garantir minha sessão estratégica. Consigo falar com vocês?'
    };

    var params = new URLSearchParams(location.search);
    var estado = params.get('estado') === 'antes' ? 'antes' : 'depois';

    var el = function (id) { return document.getElementById(id); };

    if (estado === 'depois') {
      el('titulo').textContent = 'A agenda desta turma fechou';
      el('texto').innerHTML =
        'As vagas ficaram abertas por <strong>30 minutos</strong> e já foram todas preenchidas. ' +
        'Mas se você acabou de sair da aula e quer conversar, fala direto com a gente pelo WhatsApp. ' +
        'A gente te encaixa assim que abrir a próxima leva.';
      el('labelZap').textContent = 'Quero falar com o comercial';
      el('abaixo').textContent = 'Respondemos em horário comercial, de segunda a sexta.';
    } else {
      el('icone').className = 'ti ti-clock-hour-4';
      el('titulo').textContent = 'As vagas ainda não abriram';
      el('texto').innerHTML =
        'A aplicação abre <strong>durante a aula</strong> e fica no ar por 30 minutos. ' +
        'Deixa esta página aberta: quando liberar, é só atualizar.';
      el('relogio').classList.add('show');
      el('labelZap').textContent = 'Falar com o comercial agora';
      el('abaixo').textContent = 'Se preferir não esperar, chama a gente no WhatsApp.';

      var abre = Date.parse(params.get('abre') || '');
      if (!isNaN(abre)) {
        var tick = function () {
          var falta = abre - Date.now();
          if (falta <= 0) { location.reload(); return; }
          var min = Math.floor(falta / 60000);
          var seg = Math.floor((falta % 60000) / 1000);
          el('contagem').textContent = min + ':' + (seg < 10 ? '0' : '') + seg;
        };
        tick();
        setInterval(tick, 1000);
      } else {
        el('relogio').classList.remove('show');
      }
    }

    el('btnZap').href = 'https://wa.me/' + COMERCIAL + '?text=' + encodeURIComponent(MSGS[estado]);

    el('btnZap').addEventListener('click', function () {
      window.dataLayer = window.dataLayer || [];
      window.dataLayer.push({ event: 'vaga_encerrada_whatsapp', estado: estado });
    });
  </script>
</body>
</html>
